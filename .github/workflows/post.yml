name: Post deals

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 18:00 بتوقيت الجزائر
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-deals

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python post.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
      - name: Save posted list
        if: always()
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "update posted" && git push)
